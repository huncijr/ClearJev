# ClearJev router config — single place for questions, weights, thresholds.
# Human-reviewable constants (TypeSafe good practice: questions + thresholds in one file).

jev:
  model: jev-latest
  endpoint: https://api.typesafe.ai/v1/systemone
  timeout_seconds: 8
  api_key_env: TYPESAFE_API_KEY  # fallback: JEV_API_KEY

weights:
  coding: 0.30
  reasoning: 0.25
  repository: 0.15
  risk: 0.20
  ambiguity: 0.10

thresholds:
  # confidence gates (see references/routing.md)
  intent_confidence_floor: 0.60
  complexity_confidence_floor: 0.50
  high_stakes_confirm: 0.85

# Explicit capability profiles. NOT inferred by any model — edit by hand
# after benchmarking. Scale 0-10. cost/latency class 1 (cheap/fast) - 4 (heavy).
models:
  gpt-6-luna:
    capabilities: {coding: 4, reasoning: 3, planning: 2, debugging: 3, architecture: 2, explanation: 8, speed: 10, contextHandling: 4, refactoring: 4, toolUse: 4}
    costClass: 1
    latencyClass: 1
  gpt-6-terra:
    capabilities: {coding: 6, reasoning: 5, planning: 5, debugging: 5, architecture: 4, explanation: 7, speed: 8, contextHandling: 6, refactoring: 6, toolUse: 6}
    costClass: 2
    latencyClass: 2
  gpt-6-sol:
    capabilities: {coding: 9, reasoning: 8, planning: 8, debugging: 9, architecture: 8, explanation: 7, speed: 5, contextHandling: 8, refactoring: 9, toolUse: 8}
    costClass: 3
    latencyClass: 3
  gpt-6-astra:
    capabilities: {coding: 9, reasoning: 10, planning: 10, debugging: 8, architecture: 10, explanation: 8, speed: 3, contextHandling: 10, refactoring: 8, toolUse: 7}
    costClass: 4
    latencyClass: 4

policies:
  security:
    minimum_model: gpt-6-sol
    minimum_reasoning: high
  architecture:
    minimum_reasoning: high
    planning: deep
  documentation:
    preferred_model: gpt-6-luna
  simple_tasks:
    prefer_fast_models: true
